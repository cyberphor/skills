name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '00 12 * * *'

permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Validate skills
        run: make validate
